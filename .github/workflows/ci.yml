name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run validate:publication
      - run: npx supabase start
      - run: npx supabase status --output env >> "$GITHUB_ENV"
      - run: npm run validate:commerce
      - if: always()
        run: npx supabase stop --no-backup
