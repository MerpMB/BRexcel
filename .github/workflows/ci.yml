name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run validate:publication
      - run: npx supabase start
      - name: Export the local database URL for commerce integration
        shell: bash
        run: |
          set -euo pipefail
          db_url_line="$(npx supabase status --output env | grep '^DB_URL=')"
          case "$db_url_line" in
            DB_URL=\"*\") db_url="${db_url_line#DB_URL=\"}"; db_url="${db_url%\"}" ;;
            DB_URL=\'*\') db_url="${db_url_line#DB_URL=\'}"; db_url="${db_url%\'}" ;;
            DB_URL=*) db_url="${db_url_line#DB_URL=}" ;;
            *) echo "Supabase CLI did not provide DB_URL" >&2; exit 1 ;;
          esac
          test -n "$db_url"
          printf 'COMMERCE_DATABASE_URL=%s\n' "$db_url" >> "$GITHUB_ENV"
      - run: npm run validate:commerce
      - if: always()
        run: npx supabase stop --no-backup
